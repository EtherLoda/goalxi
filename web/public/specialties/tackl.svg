<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" stroke="currentColor" color="#a1ffc2" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-label="抢断大师 Tackle Master">
  <!-- attacker ball, incoming from the left -->
  <circle cx="12" cy="42" r="5"/>
  <path d="M3 42 L6 42" stroke-width="1.5" opacity="0.6"/>
  <!-- a football boot sweeping in from the right to dispossess -->
  <!-- boot silhouette: heel, instep, toe -->
  <path d="M28 36 L36 32 L52 34 L58 40 L56 46 L48 48 L38 46 L30 44 Z"/>
  <!-- boot laces / studs hint -->
  <path d="M44 38 L50 40" stroke-width="1.2" opacity="0.6"/>
  <path d="M40 32 L40 28" stroke-width="1.5" opacity="0.6"/>
  <path d="M48 32 L50 28" stroke-width="1.5" opacity="0.6"/>
  <!-- ball knocked away up the pitch -->
  <circle cx="58" cy="18" r="3.5"/>
  <path d="M22 36 Q36 22 54 16" stroke-dasharray="3 3" opacity="0.7"/>
  <!-- ground line -->
  <path d="M4 56 L60 56" stroke-width="1.5" stroke-dasharray="2 3" opacity="0.4"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" stroke="currentColor" color="#a1ffc2" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-label="快发 Fast Start">
  <!-- stopwatch case -->
  <circle cx="30" cy="36" r="20"/>
  <!-- top button -->
  <path d="M24 14 L36 14"/>
  <path d="M30 8 L30 14"/>
  <!-- 12 / 3 / 6 tick marks -->
  <path d="M30 18 L30 22" stroke-width="1.5" opacity="0.6"/>
  <path d="M48 36 L44 36" stroke-width="1.5" opacity="0.6"/>
  <path d="M30 54 L30 50" stroke-width="1.5" opacity="0.6"/>
  <!-- hand pointing up-right (early kickoff) -->
  <path d="M30 36 L40 24"/>
  <circle cx="30" cy="36" r="1.5" fill="currentColor"/>
  <!-- speed burst to the right -->
  <path d="M52 28 L60 28 M52 36 L60 36 M52 44 L60 44" stroke-width="1.5" opacity="0.7"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" stroke="currentColor" color="#a1ffc2" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-label="点球门将 Penalty Saver">
  <!-- goal frame: posts + crossbar -->
  <path d="M10 18 L10 58 M10 18 L54 18 M54 18 L54 58"/>
  <!-- goal line / ground -->
  <path d="M4 58 L60 58" stroke-width="1.5" opacity="0.5"/>
  <!-- net mesh (faint cross-hatch inside the frame) -->
  <path d="M18 18 L18 58 M26 18 L26 58 M34 18 L34 58 M42 18 L42 58 M50 18 L50 58" stroke-width="1" opacity="0.28"/>
  <path d="M10 30 L54 30 M10 42 L54 42 M10 52 L54 52" stroke-width="1" opacity="0.28"/>
  <!-- penalty ball, saved into the top-left corner -->
  <circle cx="20" cy="24" r="4"/>
  <!-- save trajectory: ball came from the spot, curved into the corner -->
  <path d="M32 44 Q24 34 20 24" stroke-dasharray="3 3" opacity="0.7"/>
  <!-- impact burst where the ball is now -->
  <path d="M14 22 L12 20 M26 22 L28 20 M20 18 L20 16" stroke-width="1.5" opacity="0.7"/>
  <!-- penalty spot (12 yards out) -->
  <circle cx="32" cy="50" r="1.2" fill="currentColor"/>
</svg>

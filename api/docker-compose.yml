services:
  goalxi-api:
    image: goalxi-api
    container_name: goalxi-api
    restart: always
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env.docker
    # `MODULES_SET` controls which slice of the API process boots
    # — see README "Production deployment" and
    # `api/src/utils/modules-set.ts`. The `api` default (HTTP
    # controllers + the api-owned queue consumers) is correct for
    # this stack, because the `goalxi-settlement` container below
    # boots every settlement `@Cron`.
    #   * `MODULES_SET=api`         — public HTTP API (default)
    #   * `MODULES_SET=background`  — queue consumers only, no HTTP
    #
    # Do NOT set `MODULES_SET=monolith` here. `monolith` used to mean
    # "controllers + workers + settlement cron" — the api process
    # imported settlement's compiled `SchedulerModule` and ran its ~26
    # `@Cron` handlers alongside the `goalxi-settlement` container.
    # Every settlement cron therefore fired twice, with no distributed
    # lock on the multi-step unwrapped writes (season transition,
    # promotion/relegation, standings init) → double-written rows.
    # `monolith` is still accepted as a deprecated alias of `api` so
    # existing deploys don't fail to boot, but it no longer implies
    # settlement cron.
    environment:
      MODULES_SET: ${MODULES_SET:-api}
    ports:
      - "3000:3000"
    volumes:
      - ./logs:/app/logs/api
    depends_on:
      - db
      - redis
      - goalxi-settlement
    networks:
      - goalxi-network

  goalxi-settlement:
    image: goalxi-settlement
    container_name: goalxi-settlement
    restart: always
    build:
      context: ../settlement
      dockerfile: Dockerfile
    env_file:
      - .env.docker
    volumes:
      - ../settlement/logs:/app/logs/settlement
    depends_on:
      - db
      - redis
    networks:
      - goalxi-network

  goalxi-simulator:
    image: goalxi-simulator
    container_name: goalxi-simulator
    restart: always
    build:
      context: ../simulator
      dockerfile: Dockerfile
    env_file:
      - .env.docker
    volumes:
      - ../simulator/logs:/app/logs/simulator
    depends_on:
      - db
      - redis
    networks:
      - goalxi-network

  goalxi-web:
    image: goalxi-web
    container_name: goalxi-web
    restart: always
    build:
      context: ../web
      dockerfile: Dockerfile
    env_file:
      - .env.docker
    ports:
      - "8000:8000"
    depends_on:
      - goalxi-api
    networks:
      - goalxi-network

  db:
    image: postgres:16
    container_name: goalxi-db
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      TZ: "UTC"
    ports:
      - "25432:5432"
    networks:
      - goalxi-network

  redis:
    image: redis/redis-stack:latest
    container_name: goalxi-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "--raw", "incr", "ping" ]
    environment:
      REDIS_ARGS: "--requirepass redispass"
    networks:
      - goalxi-network

  maildev:
    build:
      context: .
      dockerfile: maildev.Dockerfile
    ports:
      - ${MAIL_CLIENT_PORT}:1080
      - ${MAIL_PORT}:1025
    networks:
      - goalxi-network

  pgadmin:
    container_name: pgadmin
    image: dpage/pgadmin4
    ports:
      - "18080:80"
    volumes:
      - pgadmin_data:/root/.pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: 12345678
      PGADMIN_CONFIG_WTF_CSRF_ENABLED: "False"
      PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION: "False"
    networks:
      - goalxi-network

  vector:
    image: timberio/vector:latest-alpine
    container_name: goalxi-vector
    user: root
    volumes:
      - ./logs:/app/logs/api:ro
      - ../settlement/logs:/app/logs/settlement:ro
      - ../simulator/logs:/app/logs/simulator:ro
      - ../vector.toml:/etc/vector/vector.toml:ro
    command: ["--config", "/etc/vector/vector.toml"] # 必须加这一行
    depends_on:
      - openobserve
    networks:
      - goalxi-network
    restart: unless-stopped

  openobserve:
    image: openobserve/openobserve:v0.80.0
    container_name: goalxi-openobserve
    ports:
      - "5080:5080"
    environment:
      - ZO_ROOT_USER_EMAIL=admin@goalxi.com
      - ZO_ROOT_USER_PASSWORD=${OPENOBSERVE_PASSWORD:-changeme}
      - ZO_DATA_DIR=/data
    volumes:
      - openobserve_data:/data
    networks:
      - goalxi-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5080/healthz || wget -q --spider http://localhost:5080/healthz || exit 0"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
  pgadmin_data:
  redis_data:
  openobserve_data:


networks:
  goalxi-network:

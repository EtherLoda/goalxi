# GoalXI Log Collection Configuration
# Vector collects logs from all services and forwards to OpenObserve
#
# Each pino output line is already a JSON object (NDJSON), so we let the
# `file` source decode JSON directly. The `parse_logs` transform then only
# has to (a) translate pino's integer `level` to a string, (b) convert
# pino's millisecond `time` to an ISO `timestamp`, and (c) re-tag the row
# with a `service` field so the OpenObserve queries in LOGGING.md
# (`{service="api"} level="error"`) work as written.
#
# Historical note: an earlier version of this file assumed pino's `msg`
# field held a JSON string and called `parse_json(.message)` on it, which
# silently failed for every line — OpenObserve ended up with empty rows.
# See the project log-system review for the writeup.

[sources.api_logs]
type = "file"
include = ["/app/logs/api/*.log"]
read_from = "beginning"
# NOTE: Vector 0.46+ removed per-source JSON decoding — `encoding` now
# only accepts `charset`. The `parse_logs` remap transform below
# does `parse_json!(.message)` on each raw line instead.

[sources.settlement_logs]
type = "file"
include = ["/app/logs/settlement/*.log"]
read_from = "beginning"
# NOTE: Vector 0.46+ removed per-source JSON decoding — `encoding` now
# only accepts `charset`. The `parse_logs` remap transform below
# does `parse_json!(.message)` on each raw line instead.

[sources.simulator_logs]
type = "file"
include = ["/app/logs/simulator/*.log"]
read_from = "beginning"
# NOTE: Vector 0.46+ removed per-source JSON decoding — `encoding` now
# only accepts `charset`. The `parse_logs` remap transform below
# does `parse_json!(.message)` on each raw line instead.

# Transforms - Normalize pino fields into OpenObserve-friendly shape
[transforms.parse_logs]
type = "remap"
inputs = ["api_logs", "settlement_logs", "simulator_logs"]
source = """
# Vector's `file` source delivers each line as a raw string in
# `.message` (the `decoding`/per-source codec config was removed in
# Vector 0.46+). Parse it back into a structured object and merge the
# fields into the current event so the rest of the pipeline sees the
# same shape it used to get from `decoding.codec = "json"`.
merge!(., object!(parse_json!(.message)))

# pino level (int) -> string. Pino's documented numeric levels:
#   10 trace, 20 debug, 30 info, 40 warn, 50 error, 60 fatal
# (VRL bundled with Vector latest-alpine only parses `if/else` as a
# single expression — both `if/else if/else` chains on the RHS of an
# assignment and non-literal array indices are rejected, so nest the
# branches. Verbose, but each `if/else` is a self-contained value
# expression and parses cleanly.)
.level = if .level == 10 { "trace" } else {
  if .level == 20 { "debug" } else {
    if .level == 30 { "info" } else {
      if .level == 40 { "warn" } else {
        if .level == 50 { "error" } else {
          if .level == 60 { "fatal" } else { "info" }
        }
      }
    }
  }
}

# Convert pino's millisecond timestamp to a proper timestamp
if exists(.time) {
    .timestamp = from_unix_timestamp!(to_int!(.time), unit: "milliseconds")
    del(.time)
}

# Pino's `name` binding IS the service tag (api/simulator/settlement),
# set by `@goalxi/logger` via `pino({ name: options.service })`. Re-tag
# it as `service` for the LOGGING.md query syntax and drop the original.
if exists(.name) {
    .service = string!(.name)
    del(.name)
} else {
    .service = "unknown"
}
"""

# Sinks - OpenObserve with batching
[sinks.openobserve]
type = "http"
inputs = ["parse_logs"]
method = "post"
uri = "http://openobserve:5080/api/default/goalxi-logs/_json"

[sinks.openobserve.auth]
strategy = "basic"
user = "admin@goalxi.com"
password = "changeme"

[sinks.openobserve.batch]
max_bytes = 1048576
timeout_secs = 5

[sinks.openobserve.encoding]
codec = "json"
